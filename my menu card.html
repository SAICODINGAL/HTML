<!DOCTYPE html>
<html>
    <head>
        <title>myenu card</title>
        <style>
            body{
                background-color: darkblue;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
            }
            .hero name{
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange;
            }
                .tagline{
                    font-style: italic;
                    color: lightblue;
                    text-transform: capitalize;
                }
                .label{
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
                }
                .power{
                    font-weight: bold;
                    color: lightgreen;
                }
                .weekness{
                    text-decoration: line-through;
                    color: gray;
                }
                .badge{
                    font-size: 28px;
                    font-weight: bold;
                    color: gold;
                    transform: rotate(15deg);
    
                }
                .made by{
                    color: coral;
                    font-style: italic;
                }
       
</style>
    </head>
    <body>
    <h1>class="hero name">thunder kid</h1>
    <p class="tagline">the most powerful hero in the school</p>
    <h2 class="label">super powers</h2>
    <p class="power">can run faster than cheetah</p>
    <p class="power">can lift a schoolbus</p>
    <h2 class="label">weakness</h2>
    <p class="weakness">maths homeework</p>
    <p class="weakness">broccoli</p>
    <p class="badge">top hero</p>
    <p class="made-by">created by____________</p>
    </body>
</html>
