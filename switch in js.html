<!DOCTYPE html>
<html>
    <body>
        <p id="demo"></p>
        <script>
          var day;
          switch (new Date().getDay()) {
            case 0:day
            day = "sunday";
            break;
            case 1:day
            day = "monday";
            break;
            case 2:day
            day = "tuesday";
            break;
            case 3:day
            day = "wednesday";
            break;
            case 4:day
            day = "thursday";
            break;
            case 5:day
            day = "friday";
            break;
            case 6:day
            day = "saturday";
            break;
          }  
          document.getElementById("demo").innerHTML = "today is " + day;
        </script>
    </body>
</html>
