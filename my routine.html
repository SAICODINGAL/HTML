<!DOCTYPE html>
<html>
    <head>
<title>my routine card</title>
<style>
    /* page background-sets the colorand font for this whole page */
    body{
        background-color: darkgreen;
        font-family: arial,san-serif;
    }
           
    /* box model-width sets of content area padding pushes the text away from the edges border draws a invisible frame around the fact  file margin pushes the fact file away from the screen edge*/
.fact file{
    background-color: lightyellow;
    color: darkslategray;
    width: 260px;
    padding: 25px;
    border:4px solid forestgreen
    margin 30px;
}

/* animal name-forestgreen so it stands out*/
.animal name{
    color:forestgreen;
    font-size:22px;
}

/* details rows-dark test on the light background */
.details{
color:darkslategray;
}

/* cool fact-orange and italic to make it feel special */
.coool-fact{
    color: darkorange;
    font-style:italic;
}

</style>
    </head>
    <body>
<div class="fact-file">
    <h2 class="animal-name">snow leopard</h2>
    <p class="detail">type:big cat</h2>
    <p class="detail">lives in:mountain ranges in central asia</p>
    <p  class="detail">diet:deer,goats,and wild sheep</p>
    <p class="cool-fact">cool-fact:can leap up to 15 meters in one jump!</p>
    </div>
    </body>
</html>
